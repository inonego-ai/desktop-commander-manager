[package]
name = "commander-manager"
version = "0.2.1"
description = "Secure MCP Tunnel local desktop manager"
authors = ["inonego-ai"]
edition = "2021"

[lib]
name = "commander_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
